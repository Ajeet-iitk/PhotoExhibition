<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Modern Frame -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0f172a" stroke="url(#prismGrad)" stroke-width="2.5" />
  
  <!-- 3D Camera / Prism Silhouette -->
  <circle cx="32" cy="34" r="16" fill="url(#lensGrad)" filter="url(#glow)" />
  <circle cx="32" cy="34" r="12" fill="none" stroke="#f8fafc" stroke-width="2" stroke-dasharray="4 2" opacity="0.8" />
  <circle cx="32" cy="34" r="6" fill="#f59e0b" />

  <!-- Lens Flare Sparkle -->
  <polygon points="32,8 35,16 43,19 35,22 32,30 29,22 21,19 29,16" fill="#ffffff" opacity="0.95" />
  <circle cx="46" cy="20" r="2.5" fill="#38bdf8" />
</svg>
